[package]
name = "recto"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1"
color-eyre = "0.6"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
notify = "8.2.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
ignore = "0.4"
tree-sitter = "0.26"
tree-sitter-go = "0.25"
textwrap = { version = "0.16.2", default-features = false, features = ["unicode-linebreak", "unicode-width"] }
pulldown-cmark = "0.13"

# Optimize dependencies even in dev builds while keeping recto itself
# unoptimized for fast iteration. syntect's fancy-regex highlighter is
# pathologically slow when compiled at opt-level 0, which turned a `root()`
# whole-repo diff into a ~9s highlight pass under `cargo run`.
[profile.dev.package."*"]
opt-level = 3
