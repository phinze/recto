[package]
name = "recto"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
anyhow = "1"
color-eyre = "0.6"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
notify = "8.2.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
ignore = "0.4"
tree-sitter = "0.26"
tree-sitter-go = "0.25"
